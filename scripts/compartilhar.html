<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #fff; color: #111; font-family: Georgia, "Times New Roman", serif; padding: 48px 64px 48px; display: flex; flex-direction: column; }

  .enfeite { display: flex; align-items: center; gap: 12px; height: 22px; }
  .fio { flex: 1; border-top: 2px solid #111; }
  .losango { width: 0; height: 0; border: 5px solid #111; transform: rotate(45deg); }
  .losango.grande { border-width: 8px; }
  h1 { font-family: "Times New Roman", Times, serif; font-weight: 700; font-size: 80px; line-height: 1.15; text-align: center; letter-spacing: -0.5px; padding-bottom: 6px; }
  .linha { display: flex; justify-content: space-between; font-size: 26px; padding: 10px 0; border-top: 2px solid #111; border-bottom: 7px solid #111; }
  h2 { font-family: "Times New Roman", Times, serif; font-weight: 700; font-size: 46px; line-height: 1.15; text-align: center; }
  p { font-size: 27px; font-style: italic; text-align: center; margin-top: 16px; color: #333; }
  .cinza { background: #e8e8e8; border-top: 2px solid #111; padding: 16px 24px; display: flex; justify-content: space-between; align-items: baseline; }
  .cinza strong { font-family: "Times New Roman", Times, serif; font-size: 38px; color: #6b6b6b; }
  .cinza span { font-size: 24px; color: #333; }
</style></head><body>

  <div class="linha"><span>C.E.E.P.A. Fernando Costa</span><span>agronahora.com.br</span></div>
  <div class="meio"><h2>Cotações, previsão do tempo e notícias do agro</h2>
  <p>Soja · milho · boi · café · dólar · safra · exportações · TV Agro</p></div>
  <div class="cinza"><strong>Resumo do dia</strong><span>e o Jornal do dia para imprimir ou mandar à turma</span></div>
</body></html>
